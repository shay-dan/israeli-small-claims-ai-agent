services:
  bug-reports-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: small_claims_bug_reports
      POSTGRES_USER: bug_reports_owner
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.postgres}
      BUG_REPORTS_WRITER_PASSWORD: ${BUG_REPORTS_WRITER_PASSWORD:?Set BUG_REPORTS_WRITER_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bug_reports_pgdata:/var/lib/postgresql/data
      - ./db/init_local_roles.sh:/docker-entrypoint-initdb.d/00-create-writer.sh:ro
      - ./db/bug_reports_schema.sql:/docker-entrypoint-initdb.d/10-bug-reports-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bug_reports_owner -d small_claims_bug_reports"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bug_reports_pgdata:
